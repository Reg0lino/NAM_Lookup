name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build with PyInstaller (--onedir)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name="NAM_Hardware_Finder" main.py

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path dist\NAM_Hardware_Finder\* -DestinationPath output\NAM_Hardware_Finder_Portable.zip

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/NAM_Hardware_Finder_Setup.exe
            output/NAM_Hardware_Finder_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}